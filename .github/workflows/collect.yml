name: Social Lens TikTok
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *' # 08:15 in Algeria (UTC+1)
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python collect.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PUBLICATIONS_SOURCE_ID: '3e5d99ee-b385-8116-a2fd-000bb7324292'
          NOTION_HISTORIQUE_SOURCE_ID: '3e6d99ee-b385-81de-8500-000be3e834ab'
          TIKTOK_ACCOUNTS: ${{ vars.TIKTOK_ACCOUNTS }}
          TIKTOK_BRANDS_JSON: ${{ vars.TIKTOK_BRANDS_JSON }}
          MAX_VIDEOS_PER_ACCOUNT: '20'
